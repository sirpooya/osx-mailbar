# XcodeGen spec. This file is the source of truth; Mailbar.xcodeproj is generated with
# `xcodegen generate` and gitignored.
name: Mailbar
options:
  bundleIdPrefix: in.pooya
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Project-wide so the widget extension always carries the app's version and build, as an
    # embedded extension must. scripts/release.sh bumps these two lines.
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 2

# Sparkle, the one approved package (2026-09-26, the user's request): updates from this repo's
# GitHub Releases. osx-flipoff pins the same floor.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.5"

schemes:
  Mailbar:
    build:
      targets:
        Mailbar: all
        MailbarTests: [test]
    test:
      targets:
        - MailbarTests

targets:
  Mailbar:
    type: application
    platform: macOS
    sources:
      - path: Mailbar
      # The widgets' file format and faces (M26), shared with MailbarWidgets.
      - path: MailbarWidgets/Shared
    settings:
      base:
        PRODUCT_NAME: Mailbar
        PRODUCT_BUNDLE_IDENTIFIER: in.pooya.mailbar
        # Signed with the real development certificate, never ad-hoc. A Keychain item's ACL trusts
        # the app's designated requirement; ad-hoc makes that a cdhash of one exact build, so every
        # rebuild would re-prompt for the login password before reading a stored mail password.
        # Same identity and the same three settings osx-jirabar needed (see its project.yml):
        # Manual style, the identity by SHA-1 hash, and the team id from the certificate's OU.
        # The hash is this Mac's "Apple Development: pooyak@live.com" certificate, from
        # `security find-identity -v -p codesigning`. On a different Mac it must be replaced.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ADF79CA48A71BB7E096865C8778307573FC201B7
        PROVISIONING_PROFILE_SPECIFIER: ""
        DEVELOPMENT_TEAM: 37MA269X54
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        # Resources/AppIcon.icon, an Icon Composer bundle (needs Xcode 26 to compile), the same
        # arrangement as osx-jirabar.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The App Group the widgets' file lives in (M26). Team-prefixed, the macOS form, which a
        # Development certificate may claim without a provisioning profile.
        MAILBAR_APP_GROUP: 37MA269X54.in.pooya.mailbar
      configs:
        Debug:
          # A dev build and the installed release coexist, each with its own defaults and its own
          # Keychain items, so testing never touches the real accounts.
          PRODUCT_BUNDLE_IDENTIFIER: in.pooya.mailbar.debug
          # Its own group too, so sample events never reach the installed app's widgets.
          MAILBAR_APP_GROUP: 37MA269X54.in.pooya.mailbar.debug
    info:
      path: Mailbar/Info.plist
      properties:
        CFBundleDisplayName: Mailbar
        # From the build settings above, so MARKETING_VERSION is the one place a release bumps.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Read by WidgetAgenda in the app and the widget extension.
        MailbarAppGroup: $(MAILBAR_APP_GROUP)
        # Menu-bar only: no Dock tile, ever.
        LSUIElement: true
        NSHumanReadableCopyright: ""
        # mailto: links open the composer (M23), once Mailbar is the default mail app.
        CFBundleURLTypes:
          - CFBundleURLName: Email Address
            CFBundleURLSchemes: [mailto]
            CFBundleTypeRole: Editor
        # Sparkle (UpdateController). The feed is appcast.xml on main, written by
        # scripts/release.sh; the EdDSA key is the trust anchor (the app is not notarized). Its
        # private half is in the login Keychain, account "mailbar": lose it and no installed copy
        # can be updated again.
        SUFeedURL: https://raw.githubusercontent.com/sirpooya/osx-mailbar/main/appcast.xml
        SUPublicEDKey: m3S4ZNk5wyug18duQxz01d4josXyik3Td9JYOc+9nCY=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Web content only, never the app's own requests (EWS stays HTTPS-only, enforced in
        # Account.normalizedEndpoint). A message's remote images load only after "Load images",
        # and a lot of mail still links them over plain http, which ATS would silently refuse.
        # The reader's Content-Security-Policy still governs everything the page may fetch.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    entitlements:
      path: Mailbar/Mailbar.entitlements
      properties:
        # Off. The app talks to a mail server and writes Keychain items; the sandbox buys nothing
        # here and complicates the Keychain ACL across rebuilds.
        com.apple.security.app-sandbox: false
        # Where the widgets' file is written (M26, WidgetFeed).
        com.apple.security.application-groups:
          - $(MAILBAR_APP_GROUP)
    dependencies:
      - package: Sparkle
      # Embedded in Contents/PlugIns.
      - target: MailbarWidgets

  # Up Next and Agenda (M26). Reads only the App Group file the app writes; no network, no
  # credentials. Sandboxed, as macOS requires of a widget extension.
  MailbarWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: MailbarWidgets
      - path: Mailbar/Core/TextDirection.swift
    settings:
      base:
        PRODUCT_NAME: MailbarWidgets
        PRODUCT_BUNDLE_IDENTIFIER: in.pooya.mailbar.widgets
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ADF79CA48A71BB7E096865C8778307573FC201B7
        PROVISIONING_PROFILE_SPECIFIER: ""
        DEVELOPMENT_TEAM: 37MA269X54
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @executable_path/../../../../Frameworks"
        MAILBAR_APP_GROUP: 37MA269X54.in.pooya.mailbar
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: in.pooya.mailbar.debug.widgets
          MAILBAR_APP_GROUP: 37MA269X54.in.pooya.mailbar.debug
    info:
      path: MailbarWidgets/Info.plist
      properties:
        CFBundleDisplayName: Mailbar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        MailbarAppGroup: $(MAILBAR_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MailbarWidgets/MailbarWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(MAILBAR_APP_GROUP)

  MailbarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MailbarTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.pooya.mailbar.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mailbar.app/Contents/MacOS/Mailbar"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ADF79CA48A71BB7E096865C8778307573FC201B7
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Must match the app target's team, or the test bundle fails to load into its host.
        DEVELOPMENT_TEAM: 37MA269X54
    dependencies:
      - target: Mailbar
